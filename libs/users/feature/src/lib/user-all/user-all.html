@if (error()) {
  <lab-divider></lab-divider>
  <div class="flex justify-center text-red-600">Error loading users</div>
}

@if (loaded()) {
  @defer (on viewport) {
    <lab-list-page
      [data]="listPageData()"
      (executed)="navigateUserEdit($event)"
    >
    </lab-list-page>
  } @placeholder {
    <div class="animate-pulse space-y-4 w-full h-full">
      <div class="h-20 bg-gray-200 rounded w-full"></div>
    </div>
  }
} @else {
  <div class="animate-pulse space-y-4 w-full h-full">
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
    <div class="h-20 bg-gray-200 rounded w-full"></div>
  </div>
}
