<text-control [(value)]="email" [options]="emailOptions"></text-control>
<checkbox-control [(checked)]="policies"></checkbox-control>
<app-button [options]="submitButton()" (click)="submitHandler()"></app-button>
<br />

<div class="flex flex-col">
  <div>
    {{ form.email().errors().map((x) => x.message) }}
  </div>
  <div>
    {{ form.policies().errors().map((x) => x.message) }}
  </div>
</div>
