<form [formRoot]="editionForm" class="flex flex-col gap-6 p-5">
  <mat-form-field appearance="outline">
    <mat-label>Title</mat-label>
    <input matInput [formField]="editionForm.title" aria-label="Title" />
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Description</mat-label>
    <textarea
      matInput
      aria-label="Description"
      rows="5"
      [formField]="editionForm.description"
    ></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Price</mat-label>
    <input
      matInput
      aria-label="Price"
      type="string"
      [formField]="editionForm.price"
    />
  </mat-form-field>

  <div class="flex gap-3">
    <button mat-flat-button type="submit">Save</button>

    <button mat-button type="button" (click)="cancel()">Cancel</button>
  </div>
</form>
