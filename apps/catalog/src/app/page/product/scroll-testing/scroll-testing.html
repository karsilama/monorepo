<ul
  aria-label="Scroll testing items"
  class="rounded-lg border border-slate-200 bg-white"
>
  @for (id of ids; track id) {
    <li class="px-4 py-3">
      <a [routerLink]="['/product/scroll-testing-detail', id]">
        ID: {{ id }}
      </a>
      <p class="mt-1 text-sm text-slate-500">
        A sample entry for testing a long, scrollable list.
      </p>
    </li>
  }
</ul>
