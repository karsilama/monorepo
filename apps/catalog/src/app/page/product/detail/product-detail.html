@if (product.isLoading()) {
  <div class="flex flex-col gap-3 p-6">
    <div class="h-7 w-3/4 animate-pulse rounded bg-gray-200"></div>
    <div class="h-4 w-full animate-pulse rounded bg-gray-200"></div>
    <div class="h-4 w-5/6 animate-pulse rounded bg-gray-200"></div>
  </div>
} @else {
  <main class="mx-auto max-w-4xl p-6">
    @if (product.value(); as product) {
      <section class="flex flex-col gap-6">
        <app-button
          [options]="editButton"
          (click)="editButtonHandler()"
        ></app-button>
        <h1 class="text-3xl font-bold tracking-tight">
          {{ product.title }}
        </h1>

        <p class="leading-7 text-gray-600">
          {{ product.description }}
        </p>
      </section>
    }
  </main>
}
